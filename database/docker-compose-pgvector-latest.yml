services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-template_db_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-template_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - postgres_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        servers_json=/var/lib/pgadmin/servers.json
        sed \
          -e "s/__POSTGRES_USER__/${POSTGRES_USER:-admin}/g" \
          -e "s/__POSTGRES_PASSWORD__/${POSTGRES_PASSWORD:-template_db_dev_password}/g" \
          -e "s/__POSTGRES_DB__/${POSTGRES_DB:-template_db}/g" \
          /pgadmin4/servers.json.template > "$$servers_json"
        export PGADMIN_SERVER_JSON_FILE="$$servers_json"
        exec /entrypoint.sh
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-template_db_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-template_db}
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./servers.json.template:/pgadmin4/servers.json.template:ro
    networks:
      - postgres_network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

